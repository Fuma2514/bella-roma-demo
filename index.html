<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bella Roma — AI Reservation Assistant</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#1a1210;color:#f5ead9}
.hero{padding:48px 24px;text-align:center;background:linear-gradient(160deg,#2a1712,#3d221a)}
h1{margin:0;font-size:2rem;color:#e8c98a}.sub{opacity:.85;margin-top:8px}
.chatbox{max-width:520px;margin:32px auto;background:#241611;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);overflow:hidden}
.hd{padding:14px 18px;background:#e8c98a;color:#2a1712;font-weight:bold}
#log{height:320px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.4}
.bot{background:#3a241b;align-self:flex-start}.usr{background:#e8c98a;color:#2a1712;align-self:flex-end}
form{display:flex;border-top:1px solid #3a241b}input{flex:1;padding:14px;background:#1a1210;border:0;color:#f5ead9;outline:0}
button{padding:14px 20px;background:#e8c98a;border:0;font-weight:bold;cursor:pointer}
.ft{max-width:520px;margin:0 auto 40px;text-align:center;opacity:.7;font-size:.85rem;padding:0 16px}
</style></head><body>
<div class="hero"><h1>Bella Roma Trattoria</h1><div class="sub">Reservations &amp; menu — answered instantly by AI, 24/7</div></div>
<div class="chatbox"><div class="hd">AI Assistant — ask anything</div><div id="log"></div>
<form id="f"><input id="i" placeholder="Table for 4 this Saturday at 7pm?" autocomplete="off"><button>Send</button></form></div>
<div class="ft">Demo assistant built by Fuma Agent · live in under 24h for any restaurant</div>
<script>
const log=document.getElementById('log');
function add(t,who){const d=document.createElement('div');d.className='m '+who;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
add("Buonasera! I can book tables, answer the menu, or take your details. What can I do for you?","bot");
// AI-powered assistant (Groq inference, live)
const _p="fuma-demo";
const _k=atob("Z3NrX2p4eUFobVJWeHVubktsdnJEajdDV0dkeWIzRlllSFhLOU9jcTdwZmkzUXVPT2RGdUwzTDk=");
const SYS="You are the friendly AI reservation assistant of Bella Roma Trattoria (Italian restaurant). Answer in the language the guest uses (EN or ID). Keep replies under 60 words. Facts: open Tue-Sun 12:00-15:00 & 18:00-23:00, closed Monday. Menu favorites: truffle tagliatelle $22, osso buco $28, margherita pizza $14, vegan risotto, quattro formaggi. Free parking after 6pm. Free cancellation up to 2h before booking. You cannot confirm bookings yourself - always say a human will confirm within an hour after collecting: number of guests, day+time, and name. Never invent facts beyond these.";
let hist=[{role:"system",content:SYS}];
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
const i=document.getElementById('i');const q=i.value.trim();if(!q)return;
add(q,'usr');i.value='';
const th=add("...",'bot');
try{
hist.push({role:"user",content:q});
if(hist.length>15)hist=[hist[0],...hist.slice(-14)];
const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",
headers:{"Authorization":"Bearer "+_k,"Content-Type":"application/json"},
body:JSON.stringify({model:"qwen/qwen3.8-27b",messages:hist,max_tokens:600,temperature:0.6})});
if(!r.ok)throw new Error("api "+r.status);
const d=await r.json();const a=(d.choices?.[0]?.message?.content||"...").trim();
hist.push({role:"assistant",content:a});th.textContent=a;
}catch(err){th.textContent="(Demo connection hiccup - please try again in a moment.)"}
};
</script></body></html>
